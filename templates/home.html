{% extends "base.html" %}

{% block content %}
  <button class="menu-button" type="button" aria-label="Open menu"></button>

  <div class="menu" id="menu" hidden>
    <div class="menu-inner">
      <div class="menu-header">
        <div class="menu-actions">
          <button data-action="reload" type="button">reload</button>
          <button data-action="qr" type="button">show qr</button>
          <button data-action="screen" type="button">screen</button>
        </div>

        <div class="menu-categories">
          <div class="category-btns">
            {% for category in categories %}
            <button data-category="{{ category.name|lower }}" type="button">
              {{ category.name }}
            </button>
            {% endfor %}
          </div>

          <div class="random-btn">
            <button data-action="random" title="random" type="button">⟲</button>
            <button data-action="shuffle" title="shuffle" type="button">⤨</button>
          </div>
        </div>
      </div>

      <div class="menu-content">
        <div class="menu-playlists" id="playlists"></div>

        <div class="menu-qr" id="qr-container" hidden>
          <div class="qr-box">
            <button class="qr-img" data-action="regenerate-qr" type="button">
              {% if qr_code_b64 %}
                <img src="data:image/png;base64,{{ qr_code_b64 }}" alt="Regenerate QR Code">
              {% endif %}
            </button>
          </div>
        </div>
      </div>

      <div class="menu-footer">
        <div class="menu-actions">
          <button data-action="close" type="button">close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="player-container">
    <div id="loading-indicator" role="status" aria-live="polite" hidden>
      <span class="loading-indicator-spinner" aria-hidden="true"></span>
      <span>Loading</span>
    </div>
    <div id="now-playing" role="status" aria-live="polite">
      <span id="now-playing-status" hidden></span>
      <div id="now-playing-meta">
        <span id="now-playing-context" hidden></span>
        <span id="now-playing-duration" hidden></span>
      </div>
      <div id="now-playing-title"></div>
    </div>
    <video id="video-player" autoplay playsinline muted>
      <track id="subtitle-track" kind="subtitles" srclang="en" label="English">
    </video>
    <div id="paused-controls" aria-label="Paused playback controls" hidden>
      <button data-paused-action="back" type="button" aria-label="Back 20 seconds">−20 seconds</button>
      <button data-paused-action="forward" type="button" aria-label="Forward 20 seconds">+20 seconds</button>
      <button data-paused-action="next" type="button">Next video</button>
    </div>
    <div id="video-hud">
      <div id="video-controls">
        <span id="playback-state">Playing</span>
        <span id="time-current">0:00</span>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <span id="time-remaining">-0:00</span>
        <button id="cc-toggle" type="button" title="Toggle captions">CC</button>
      </div>
    </div>
  </div>
{% endblock %}

{% block window_vars %}
  window.CATEGORIES_DATA = {{ categories_json|safe }};
{% endblock %}

{% block page_script %}
  <script type="module" src="{{ url_for('static', filename='js/piStuff.js') }}"></script>
{% endblock %}
